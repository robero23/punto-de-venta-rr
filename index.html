ut id="pname" placeholder="Ej. Refresco 600 ml">
<div class="grid"><div><label>Precio de venta ($)</label><input id="pprice" type="number" min="0" step=".01" placeholder="18"></div><div><label>Existencia</label><input id="pstock" type="number" min="0" step="1" placeholder="20"></div></div>
<button class="primary full" onclick="addProduct()">Guardar producto</button>
</div>
<div class="card"><input id="psearch" placeholder="Buscar producto..." oninput="renderProducts()"><div id="productList"></div></div>
</section>
<section id="sale" class="panel">
<h2>Nueva venta</h2>
<div class="card"><input id="ssearch" placeholder="Buscar producto..." oninput="renderSaleProducts()"><div id="saleProducts"></div></div>
<div class="card"><h3>Carrito</h3><div id="cartList" class="empty">Agrega productos para comenzar</div><div class="row"><strong>Total</strong><strong class="metric" id="cartTotal">$0.00</strong></div>
<label>Método de pago</label><select id="payment"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Fiado</option></select>
<button class="primary full" onclick="finishSale()">Cobrar y guardar venta</button></div>
</section>
<section id="history" class="panel">
<h2>Historial de ventas</h2><div class="card"><div class="row"><strong>Ventas registradas</strong><button class="secondary" onclick="exportSales()">Exportar CSV</button></div><div id="historyList"></div></div>
</section>
</main>
<script>
const KEY='rr_negocios_v1';
const seed=[
 {id:1,name:'Agua 1 litro',price:12,stock:20},
 {id:2,name:'Refresco 600 ml',price:18,stock:18},
 {id:3,name:'Sabritas',price:17,stock:15},
 {id:4,name:'Galletas',price:15,stock:12},
 {id:5,name:'Leche 1 litro',price:28,stock:10},
 {id:6,name:'Huevo (docena)',price:42,stock:8}
];
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{products:seed,sales:[]},cart=[];
function save(){localStorage.setItem(KEY,JSON.stringify(data));renderAll()}
function money(n){return '$'+Number(n||0).toFixed(2)}
function tab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='sale')renderSaleProducts()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function addProduct(){let name=document.getElementById('pname').value.trim(),price=Number(document.getElementById('pprice').value),stock=Number(document.getElementById('pstock').value);if(!name||price<=0||stock<0||!Number.isFinite(price)||!Number.isFinite(stock)){alert('Revisa el nombre, precio y existencia.');return}data.products.push({id:Date.now(),name,price,stock});document.getElementById('pname').value='';document.getElementById('pprice').value='';document.getElementById('pstock').value='';save();alert('Producto guardado.')}
function renderProducts(){let q=(document.getElementById('psearch').value||'').toLowerCase();let arr=data.products.filter(p=>p.name.toLowerCase().includes(q));document.getElementById('productList').innerHTML=arr.length?arr.map(p=>`<div class="item row"><div><b>${esc(p.name)}</b><div class="muted">${money(p.price)} · Existencia: ${p.stock}</div></div><div class="actions"><button class="secondary" onclick="editStock(${p.id})">Stock</button><button class="danger" onclick="deleteProduct(${p.id})">×</button></div></div>`).join(''):'<div class="empty">No hay productos.</div>'}
function editStock(id){let p=data.products.find(x=>x.id===id),v=prompt('Nueva existencia de '+p.name,p.stock);if(v===null)return;if(v.trim()===''||!Number.isFinite(Number(v))||Number(v)<0){alert('Cantidad no válida');return}p.stock=Number(v);save()}
function deleteProduct(id){if(confirm('¿Eliminar este producto?')){data.products=data.products.filter(p=>p.id!==id);save()}}
function renderSaleProducts(){let q=(document.getElementById('ssearch').value||'').toLowerCase();let arr=data.products.filter(p=>p.name.toLowerCase().includes(q));document.getElementById('saleProducts').innerHTML=arr.length?arr.map(p=>`<div class="item row"><div><b>${esc(p.name)}</b><div class="muted">${money(p.price)} · Disponibles: ${p.stock}</div></div><button class="secondary" ${p.stock<=0?'disabled':''} onclick="addCart(${p.id})">Agregar</button></div>`).join(''):'<div class="empty">No se encontraron productos.</div>'}
function addCart(id){let p=data.products.find(x=>x.id===id),c=cart.find(x=>x.id===id);if(!p||p.stock<=0)return;if(c){if(c.qty>=p.stock){alert('No hay más existencia.');return}c.qty++}else cart.push({id,qty:1});renderCart()}
function changeQty(id,d){let c=cart.find(x=>x.id===id),p=data.products.find(x=>x.id===id);if(!c)return;c.qty+=d;if(c.qty<=0)cart=cart.filter(x=>x.id!==id);else if(c.qty>p.stock){c.qty=p.stock;alert('Cantidad limitada por existencia.')}renderCart()}
function total(){return cart.reduce((s,c)=>{let p=data.products.find(x=>x.id===c.id);return s+(p?p.price*c.qty:0)},0)}
function renderCart(){let el=document.getElementById('cartList');el.className=cart.length?'':'empty';el.innerHTML=cart.length?cart.map(c=>{let p=data.products.find(x=>x.id===c.id);return `<div class="item row"><div><b>${esc(p.name)}</b><div class="muted">${c.qty} × ${money(p.price)} = ${money(c.qty*p.price)}</div></div><div class="actions"><button class="secondary" onclick="changeQty(${c.id},-1)">−</button><button class="secondary" onclick="changeQty(${c.id},1)">+</button></div></div>`}).join(''):'Agrega productos para comenzar';document.getElementById('cartTotal').textContent=money(total())}
function finishSale(){if(!cart.length){alert('El carrito está vacío.');return}for(let c of cart){let p=data.products.find(x=>x.id===c.id);if(!p||p.stock<c.qty){alert('Existencia insuficiente de '+(p?p.name:'un producto'));return}}let sale={id:Date.now(),date:new Date().toISOString(),items:cart.map(c=>{let p=data.products.find(x=>x.id===c.id);return {name:p.name,price:p.price,qty:c.qty}}),total:total(),payment:document.getElementById('payment').value};cart.forEach(c=>data.products.find(p=>p.id===c.id).stock-=c.qty);data.sales.unshift(sale);cart=[];save();renderCart();alert('Venta guardada: '+money(sale.total));tab('home')}
function renderHistory(){let el=document.getElementById('historyList');el.innerHTML=data.sales.length?data.sales.map(s=>`<div class="item"><div class="row"><b>${new Date(s.date).toLocaleString('es-MX')}</b><b class="price">${money(s.total)}</b></div><div class="muted">${esc(s.payment)} · ${s.items.reduce((n,i)=>n+i.qty,0)} artículos</div><div class="muted">${s.items.map(i=>esc(i.name)+' × '+i.qty).join(', ')}</div></div>`).join(''):'<div class="empty">Todavía no hay ventas.</div>'}
function renderHome(){let today=new Date().toDateString(),sales=data.sales.filter(s=>new Date(s.date).toDateString()===today);document.getElementById('todaySales').textContent=money(sales.reduce((a,s)=>a+s.total,0));document.getElementById('todayCount').textContent=sales.length;document.getElementById('productCount').textContent=data.products.length;document.getElementById('stockValue').textContent=money(data.products.reduce((a,p)=>a+p.price*p.stock,0))}
function renderAll(){renderHome();renderProducts();renderSaleProducts();renderHistory();renderCart()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function backup(){download('respaldo-rr-negocios.json',JSON.stringify(data,null,2),'application/json')}
function exportSales(){let rows=[['Fecha','Total','Pago','Articulos'],...data.sales.map(s=>[new Date(s.date).toLocaleString('es-MX'),s.total,s.payment,s.items.map(i=>`${i.name} x${i.qty}`).join(' | ')])];download('ventas-rr-negocios.csv',rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
renderAll();
</script>
